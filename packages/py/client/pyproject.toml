[project]
name = "seshi"
dynamic = ["version"]
description = "The typed Python client for a seshi server: store, read, search and tail coding-agent sessions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Dosu" }]
keywords = ["seshi", "coding-agent", "sessions", "traces", "claude-code", "codex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1", "pydantic>=2.7,<3"]

[project.urls]
Homepage = "https://github.com/dosu-ai/seshi"
Documentation = "https://github.com/dosu-ai/seshi/blob/main/docs/client.md"
Source = "https://github.com/dosu-ai/seshi/tree/main/packages/py/client"
Changelog = "https://github.com/dosu-ai/seshi/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pyyaml>=6.0",
  "ruff>=0.8",
  "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# The version is the release's, as packages/ts/model/package.json holds it:
# scripts/release-version.ts writes both, and tests/test_version.py holds them together.
[tool.hatch.version]
path = "src/seshi/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/seshi"]

# The tests start a server from the seshi repository, so they stay there.
[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["live: runs against a real seshi server started from this repository"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "ASYNC", "C4", "PIE", "RET"]
# `assert a is not None and a.x == 1` reads better than two asserts in a test.
ignore = ["PT018"]

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
