name: Feature request
description: Propose a change to what the server or SDK does, or support for another agent.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open an issue before writing a large change, such as a new agent format, a new store,
        a new route, or anything that changes `spec/layout.md`. Readers of existing buckets
        depend on the layout, so changes to it need agreement first.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change? A request and response sketch, or an SDK call, helps.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, and why they fall short.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to open the pull request for this myself.
