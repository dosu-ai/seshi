name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The process-mode scenarios (scenarios-process below), nightly or by hand.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Every job's GITHUB_TOKEN can read the repository and nothing more, unless the job grants
# itself more: release, image and npm do, each only what it uses. Checkouts keep no
# credentials in .git/config (persist-credentials: false): no job pushes with the checkout's
# token; semantic-release pushes the release commit and tag with the GitHub App token it is
# handed. Actions are pinned to commit SHAs, the release in the comment; Dependabot
# (.github/dependabot.yml) proposes the updates.
permissions:
  contents: read

jobs:
  test:
    # The nightly schedule runs only scenarios-process; pushes, pull requests and a run by hand
    # run the rest (so do test-windows, docker, binaries and darwin-cross).
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      s3:
        image: rustfs/rustfs:1.0.5@sha256:b81d16a90ee25bd9511280127ca1471788c6e874cf0f0da759645f46b2dc1d74
        ports: ["9000:9000"]
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - run: bun run test
      # X3.3: seshi hook runs on every agent turn. Fail on a stray top-level import of server,
      # pipeline, store or search code, or a start-up over budget, from source and compiled.
      - name: Time seshi hook (source)
        run: bun run check:hook
      - name: Build the binary and time seshi hook (compiled)
        run: |
          bun run build
          bun run check:hook --binary dist/seshi
      - name: Create the S3 test bucket
        run: |
          pip install --quiet awscli==1.46.3
          AWS_ACCESS_KEY_ID=rustfsadmin AWS_SECRET_ACCESS_KEY=rustfsadmin AWS_DEFAULT_REGION=us-east-1 \
            aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://sessiondb-test
      - name: S3 store test against a live endpoint
        env:
          SESSIONDB_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          SESSIONDB_TEST_S3_BUCKET: sessiondb-test
          SESSIONDB_TEST_S3_ACCESS_KEY: rustfsadmin
          SESSIONDB_TEST_S3_SECRET_KEY: rustfsadmin
        run: bun --bun vitest run tests/store/s3-live.test.ts

  # F8.4 (revised 15 Nov 2026): the tests of what runs on laptops (capture's hooks, spool,
  # uploader, sweep and state; the agents' hook handlers and installers; the CLI config; the
  # client; the CLI's wiring) on Windows. vitest.laptop.config.ts lists them. The server's tests
  # stay on Linux (the test job). Line endings are kept as committed: transcripts, hook payloads
  # and the plugin's files are compared byte for byte.
  test-windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run test:laptop

  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: docker build -f apps/seshi/Dockerfile -t sessiondb .
      - name: Boot against a file store and hit /healthz
        run: |
          docker run --rm sessiondb --version
          docker run -d --name sessiondb -p 7200:7200 \
            -e SESHI_AUTH__TOKENS__CI=ci-token-0123456789abcdef -e SESHI_STORE__URL=file:///data \
            -e SESHI_WORKER__HEARTBEAT_INTERVAL=1s sessiondb
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:7200/healthz; then
              # The image's own health check, and the worker role's heartbeat (X7.5).
              docker exec sessiondb seshi healthcheck
              sleep 2
              docker exec sessiondb seshi workers status --json | grep -q '"state": "running"'
              exit 0
            fi
            sleep 1
          done
          docker logs sessiondb
          exit 1

  # F8.4: the binary on every platform it ships for, built natively on that platform's runner.
  # Each one is put through scripts/release/smoke.ts: serve, admin init, login with the org key
  # (Bun.secrets: the macOS Keychain, Windows Credential Manager, or the 0600 file on a Linux
  # runner without a secret service), whoami, an upload redacted before sending with an RE2 rule
  # pack, capture install (hooks must name the binary's path), logout. Then the install script
  # installs it from a local copy of the release, as a person would.
  binaries:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, keychain: allowed }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, keychain: allowed }
          - { target: darwin-arm64, runner: macos-latest, keychain: required }
          - { target: darwin-x64, runner: macos-15-intel, keychain: required }
          - { target: windows-x64, runner: windows-latest, keychain: required }
          - { target: windows-arm64, runner: windows-11-arm, keychain: required }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      # A release folder laid out as GitHub serves one: latest/download/<asset>.
      - name: Build this platform's release assets
        run: bun run release:build --target ${{ matrix.target }} --out dist/site/latest/download
      - name: Smoke test the binary
        shell: bash
        run: |
          bin=dist/site/latest/download/bin/${{ matrix.target }}/seshi
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          bun run release:smoke "$bin" --keychain ${{ matrix.keychain }}
      # X3.3 on every platform, with the very binary this job ships: a real `seshi hook` (a
      # temporary home, a Stop payload, the spool written) under the 250 ms budget. The test job
      # times dist/seshi on Linux only; this is where a Windows or macOS hook is exercised.
      - name: Time seshi hook (this platform's binary)
        shell: bash
        run: |
          bin=dist/site/latest/download/bin/${{ matrix.target }}/seshi
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          bun run check:hook --binary "$bin"
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          sh scripts/install/install.sh --base-url "file://$PWD/dist/site" --dir "$RUNNER_TEMP/seshi-bin"
          "$RUNNER_TEMP/seshi-bin/seshi" --version
      - name: Install with install.ps1 (PowerShell 7 and Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $server = Start-Process -PassThru -NoNewWindow bun -ArgumentList 'run','scripts/release/serve-dir.ts','dist/site','8765'
          Start-Sleep -Seconds 2
          try {
            ./scripts/install/install.ps1 -BaseUrl http://127.0.0.1:8765 -InstallDir "$env:RUNNER_TEMP\seshi-pwsh"
            & "$env:RUNNER_TEMP\seshi-pwsh\seshi.exe" --version
            if ($LASTEXITCODE -ne 0) { exit 1 }
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install/install.ps1 -BaseUrl http://127.0.0.1:8765 -InstallDir "$env:RUNNER_TEMP\seshi-ps51" -NoModifyPath
            if ($LASTEXITCODE -ne 0) { exit 1 }
            & "$env:RUNNER_TEMP\seshi-ps51\seshi.exe" --version
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } finally {
            Stop-Process -Id $server.Id -Force
          }

  # The release job cross-compiles the macOS binaries on Linux, and Bun's in-process Mach-O
  # signer has shipped broken ad-hoc signatures more than once (oven-sh/bun#29120, #39758);
  # its x64 build keeps Bun's own, no longer valid, signature. scripts/release/build.ts
  # therefore re-signs both darwin binaries ad hoc (scripts/release/macho-sign.ts). These build
  # the darwin targets the way the release job does and check the result on a Mac.
  darwin-cross:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run release:build --target darwin-arm64 --target darwin-x64 --out dist/cross
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: darwin-cross
          path: dist/cross/seshi-darwin-*.tar.gz
          retention-days: 3

  darwin-cross-check:
    needs: darwin-cross
    runs-on: macos-latest
    # No checkout; the artifact comes from this run, which needs no token scope.
    permissions: {}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: darwin-cross
          path: cross
      - name: The Linux-built macOS binaries are validly signed and run
        run: |
          for id in darwin-arm64 darwin-x64; do
            mkdir -p "cross/$id"
            tar -xzf "cross/seshi-$id.tar.gz" -C "cross/$id"
            codesign --verify --verbose "cross/$id/seshi"
          done
          cross/darwin-arm64/seshi --version

  # The process-mode capture scenarios (docs/seshi/build/34-scenario-proc.md): a real seshi
  # serve, uploaders, hooks and capture commands as separate processes, a TCP fault proxy,
  # process kills and races. Slow and on free ports, so not in `bun run test`: nightly, or by hand.
  scenarios-process:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run scenarios:process

  # Every push to main with a Conventional Commit since the last release is a release
  # (release.config.js): the version is chosen from the commits, every target is
  # cross-compiled, and a vX.Y.Z tag and a GitHub release with the archives, the install
  # scripts and SHA256SUMS are cut. The jobs after it publish the npm packages and the image
  # from that release's own assets, then install it on every platform.
  #
  # The release commit and tag are pushed as the abbs-bot GitHub App, the org's
  # release bot (its credentials are the org-wide ABBS_BOT_* secrets): main only takes pull
  # requests, and that app is the ruleset's one bypass actor.
  release:
    needs: [test, test-windows, docker, binaries, darwin-cross-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ABBS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.ABBS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: sessiondb
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      # semantic-release pushes with the app token above (GITHUB_TOKEN below), not with the
      # checkout's, so the checkout keeps no credentials.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # semantic-release runs on Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - id: release
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  image:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The release commit, not the push that triggered the run: it carries the version
      # packages/ts/model/package.json holds, which /healthz reports.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      # The image ships the release's own Linux binaries (X2.2: one binary, every channel),
      # checked against SHA256SUMS, rather than compiling again.
      - name: Fetch the release's Linux binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/release
          gh release download "v${{ needs.release.outputs.version }}" --dir dist/release \
            --pattern 'seshi-linux-*.tar.gz' --pattern SHA256SUMS
          (cd dist/release && grep -E ' seshi-linux-(x64|arm64)\.tar\.gz$' SHA256SUMS | sha256sum -c -)
          for pair in amd64:x64 arm64:arm64; do
            mkdir -p "dist/docker/linux-${pair%%:*}"
            tar -xzf "dist/release/seshi-linux-${pair##*:}.tar.gz" -C "dist/docker/linux-${pair%%:*}" seshi
          done
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/seshi/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: BINARY=prebuilt
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # F8.4, X3.8: the npm packages, built from the release's archives (so npm carries the very
  # binaries GitHub does) and published with provenance: @seshi/cli-<target> for every target,
  # @seshi/model, @seshi/client, then the `seshi` launcher. A package already on the registry
  # is skipped, so the job can be re-run. Publishing needs NPM_TOKEN (an automation token for
  # the @seshi scope and the seshi name), or npm trusted publishing set up for this workflow.
  npm:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Fetch the release's archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${{ needs.release.outputs.version }}" --dir dist/release \
            --pattern 'seshi-*' --pattern SHA256SUMS
      - run: bun run release:npm --version ${{ needs.release.outputs.version }} --from dist/release --out dist/npm
      - run: bun run release:publish-npm --provenance --dir dist/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The published release, installed on every platform through each channel: the install
  # script and npm. Each binary is then smoke tested as in the binaries job.
  verify:
    needs: [release, npm]
    if: needs.release.outputs.released == 'true'
    # It runs what was just published (npm i -g, npx, curl | sh): read access, nothing else.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest, keychain: allowed }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, keychain: allowed }
          - { target: darwin-arm64, runner: macos-latest, keychain: required }
          - { target: darwin-x64, runner: macos-15-intel, keychain: required }
          - { target: windows-x64, runner: windows-latest, keychain: required }
          - { target: windows-arm64, runner: windows-11-arm, keychain: required }
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: install.sh from the release
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/v$VERSION/install.sh" \
            | sh -s -- --version "$VERSION" --dir "$RUNNER_TEMP/seshi-bin" --no-modify-path
          test "$("$RUNNER_TEMP/seshi-bin/seshi" --version)" = "seshi $VERSION"
          bun run release:smoke "$RUNNER_TEMP/seshi-bin/seshi" --version "$VERSION" --keychain ${{ matrix.keychain }}
      - name: install.ps1 from the release
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $script = Invoke-RestMethod "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/install.ps1"
          & ([scriptblock]::Create($script)) -Version $env:VERSION -InstallDir "$env:RUNNER_TEMP\seshi-bin"
          $exe = "$env:RUNNER_TEMP\seshi-bin\seshi.exe"
          if ((& $exe --version) -ne "seshi $env:VERSION") { exit 1 }
          bun run release:smoke $exe --version $env:VERSION --keychain ${{ matrix.keychain }}
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: npm i -g seshi
        shell: bash
        run: |
          npm install -g "seshi@$VERSION"
          test "$(seshi --version)" = "seshi $VERSION"
          test "$(npx --yes "seshi@$VERSION" --version)" = "seshi $VERSION"
