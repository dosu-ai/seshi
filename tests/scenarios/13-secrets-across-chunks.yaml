# Guards F2.4 and the server's redaction: a planted credential is never stored, whichever path
# carries it: a first upload the filter holds back and later sends whole, a chunk, a subagent,
# a rebuild after a format bump, a replace after a rule change, and a compaction summary. The
# invariant that scans the whole bucket (trace objects unzipped) runs after every step.
name: secrets across chunk boundaries
description: >
  The fake credentials are planted in the first turn, which is too small to store on its own;
  more turns follow in later passes, in a subagent, through a rebuild and a replace. No step
  may leave a planted secret anywhere in the bucket or in what review is sent.
guards: "F2.4: secrets in turn 1 and in later chunks are never stored"
setup:
  review: true
steps:
  - turns: { session: main, count: 1, secret: true }
  - pass
  - expect:
      sessions:
        main: { server: absent, last-status: filtered }
  - turns: { session: main, count: 1 }
  - pass
  - expect:
      sessions:
        main: { server: present }
  - turns: { session: main, count: 1, secret: true }
  - pass
  - subagent: { parent: main, id: helper, turns: 2, secret: true }
  - pass
  - expect:
      sessions:
        main: { traces: 2 }
        agent-helper: { server: present }
  - review: [redact]
  - turns: { session: main, count: 1, secret: true, mark: reviewed-part }
  - pass
  - format-bump: claude-code
  - clock: +2h
  - pass
  - clock: +1d
  - pass
  - rules:
      add: [{ id: typed-constant, pattern: "typed constant" }]
  - compact: { session: main, mode: shrink, keep: 1 }
  - pass
  # The subagent was not sent again: the backfill applies the new rule to what it stored.
  - backfill
  - expect:
      sessions:
        main: { server: present, matches-transcript: true }
      bucket:
        lacks: [reviewed-part]
  - settle
