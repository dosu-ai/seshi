<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" role="img" aria-labelledby="title desc">
  <title id="title">seshi architecture</title>
  <desc id="desc">A session flows from the coding agent's hooks through the spool and uploader on the developer laptop, over HTTP to the seshi serve API and its in-memory pipeline, and into the bucket. Other sources reach the worker. Readers use the seshi CLI, the HTTP API, or the bucket's change feed. In serverless mode each laptop's CLI runs the pipeline and writes its owner's folder of the shared bucket itself.</desc>
  <style>
    svg { --bg: #F6F4EE; --panel: #ECE8DE; --fg: #173A41; --muted: #5A6B70; --line: rgba(23, 58, 65, 0.22); --accent: #247C73; --accent-fill: rgba(36, 124, 115, 0.16); --accent-fill-2: rgba(36, 124, 115, 0.30); }
    @media (prefers-color-scheme: dark) {
      svg { --bg: #171D2A; --panel: #1E2636; --fg: #F6F4EE; --muted: #9AA5B6; --line: rgba(246, 244, 238, 0.18); --accent: #76D6C6; --accent-fill: rgba(118, 214, 198, 0.14); --accent-fill-2: rgba(118, 214, 198, 0.28); }
    }
    .bg { fill: var(--bg); }
    .zone { fill: var(--panel); stroke: var(--line); }
    .box { fill: var(--bg); stroke: var(--fg); stroke-width: 1.2; }
    .box-accent { fill: var(--accent-fill); stroke: var(--accent); stroke-width: 1.4; }
    .chip { fill: var(--accent-fill-2); stroke: var(--accent); stroke-width: 1; }
    text { font-family: Manrope, "Avenir Next", "Segoe UI", Arial, sans-serif; }
    .t { fill: var(--fg); font-size: 12px; }
    .tb { fill: var(--fg); font-size: 13px; font-weight: 700; }
    .ts { fill: var(--muted); font-size: 11px; }
    .tm { fill: var(--fg); font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; }
    .tz { fill: var(--accent); font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11px; letter-spacing: 0.08em; }
    .tc { fill: var(--fg); font-size: 9.5px; font-weight: 600; }
    .edge { fill: none; stroke: var(--fg); stroke-width: 1.3; }
    .edge-accent { fill: none; stroke: var(--accent); stroke-width: 1.8; }
    .edge-dash { fill: none; stroke: var(--muted); stroke-width: 1.3; stroke-dasharray: 5 4; }
    .head { fill: var(--fg); }
    .head-accent { fill: var(--accent); }
    .head-muted { fill: var(--muted); }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="aha" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-accent" d="M0,0 L8,4 L0,8 z"/></marker>
    <marker id="ahm" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="head-muted" d="M0,0 L8,4 L0,8 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="600" rx="12"/>

  <!-- Laptop -->
  <rect class="zone" x="20" y="30" width="290" height="390" rx="10"/>
  <text class="tz" x="36" y="56">DEVELOPER LAPTOP</text>
  <rect class="box" x="40" y="72" width="250" height="46" rx="6"/>
  <text class="tb" x="165" y="91" text-anchor="middle">Coding agents</text>
  <text class="ts" x="165" y="108" text-anchor="middle">Claude Code · Codex · Cursor · others</text>
  <rect class="box" x="40" y="158" width="250" height="40" rx="6"/>
  <text class="tm" x="165" y="182" text-anchor="middle">seshi hook &lt;agent&gt; &lt;event&gt;</text>
  <rect class="box" x="40" y="236" width="250" height="40" rx="6"/>
  <text class="t" x="165" y="260" text-anchor="middle">Spool: one small file per event</text>
  <rect class="box-accent" x="40" y="314" width="250" height="58" rx="6"/>
  <text class="tb" x="165" y="337" text-anchor="middle">Uploader</text>
  <text class="ts" x="165" y="356" text-anchor="middle">lock · state.json · capture decision</text>
  <path class="edge" d="M165,118 V156" marker-end="url(#ah)"/>
  <text class="ts" x="173" y="142">Stop, SessionStart, …</text>
  <path class="edge" d="M165,198 V234" marker-end="url(#ah)"/>
  <text class="ts" x="173" y="221">appends</text>
  <path class="edge" d="M165,276 V312" marker-end="url(#ah)"/>
  <text class="ts" x="173" y="299">drains each pass</text>
  <text class="ts" x="40" y="400">The status line and desktop chip read state.json</text>

  <!-- Server -->
  <rect class="zone" x="370" y="30" width="330" height="390" rx="10"/>
  <text class="tz" x="386" y="56">SESHI SERVE</text>
  <rect class="box" x="390" y="72" width="290" height="46" rx="6"/>
  <text class="tb" x="535" y="91" text-anchor="middle">HTTP API</text>
  <text class="ts" x="535" y="108" text-anchor="middle">auth: org key · device · session · admin · service</text>
  <rect class="box-accent" x="390" y="158" width="290" height="96" rx="6"/>
  <text class="tb" x="535" y="180" text-anchor="middle">Pipeline, in memory</text>
  <rect class="chip" x="394" y="194" width="52" height="24" rx="4"/>
  <text class="tc" x="420" y="210" text-anchor="middle">normalize</text>
  <rect class="chip" x="452" y="194" width="52" height="24" rx="4"/>
  <text class="tc" x="478" y="210" text-anchor="middle">redact</text>
  <rect class="chip" x="510" y="194" width="52" height="24" rx="4"/>
  <text class="tc" x="536" y="210" text-anchor="middle">filter</text>
  <rect class="chip" x="568" y="194" width="52" height="24" rx="4"/>
  <text class="tc" x="594" y="210" text-anchor="middle">review</text>
  <rect class="chip" x="626" y="194" width="52" height="24" rx="4"/>
  <text class="tc" x="652" y="210" text-anchor="middle">write</text>
  <text class="ts" x="535" y="240" text-anchor="middle">only the result is written; nothing raw</text>
  <rect class="box" x="390" y="294" width="290" height="78" rx="6"/>
  <text class="tb" x="535" y="315" text-anchor="middle">Worker</text>
  <text class="ts" x="535" y="335" text-anchor="middle">assembler · pollers · search index</text>
  <text class="ts" x="535" y="353" text-anchor="middle">sweep · retention · heartbeat</text>
  <path class="edge-accent" d="M535,118 V156" marker-end="url(#aha)"/>
  <text class="ts" x="543" y="142">envelope</text>
  <path class="edge" d="M535,294 V256" marker-end="url(#ah)"/>
  <text class="ts" x="543" y="279">assembled OTLP sessions</text>

  <!-- Bucket -->
  <rect class="zone" x="750" y="30" width="230" height="390" rx="10"/>
  <text class="tz" x="766" y="56">BUCKET</text>
  <text class="ts" x="766" y="74">s3:// · r2:// · az:// · file://</text>
  <rect class="box" x="766" y="90" width="198" height="312" rx="6"/>
  <text class="tm" x="778" y="116">owners/&lt;owner&gt;/</text>
  <text class="tm" x="778" y="138" xml:space="preserve">  sessions/&lt;id&gt;/</text>
  <text class="tm" x="778" y="160" xml:space="preserve">    metadata.json</text>
  <text class="tm" x="778" y="182" xml:space="preserve">    trace.&lt;hash&gt;.json.gz</text>
  <text class="tm" x="778" y="204" xml:space="preserve">    spans/  review/</text>
  <text class="tm" x="778" y="226" xml:space="preserve">  changes/</text>
  <text class="tm" x="778" y="260">tokens/</text>
  <text class="tm" x="778" y="282">sources/</text>
  <text class="tm" x="778" y="304">assembly/pending/</text>
  <text class="tm" x="778" y="326">worker/heartbeat.json</text>
  <text class="tm" x="778" y="348">seshi.json</text>
  <text class="ts" x="778" y="384">the source of truth</text>

  <!-- Laptop to server -->
  <path class="edge-accent" d="M290,330 C330,330 330,100 388,100" marker-end="url(#aha)"/>
  <text class="ts" x="352" y="215" text-anchor="middle" transform="rotate(-90 352 215)">POST /v1/sessions</text>
  <!-- Server to bucket -->
  <path class="edge-accent" d="M680,206 H764" marker-end="url(#aha)"/>
  <text class="ts" x="725" y="198" text-anchor="middle">writes</text>
  <path class="edge" d="M682,333 H764" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="ts" x="725" y="325" text-anchor="middle">reads, sweeps</text>
  <!-- Serverless mode -->
  <path class="edge-dash" d="M290,362 H330 V442 H800 V422" marker-end="url(#ahm)"/>

  <!-- Other sources -->
  <rect class="box" x="20" y="480" width="290" height="56" rx="6"/>
  <text class="tb" x="165" y="502" text-anchor="middle">Other sources</text>
  <text class="ts" x="165" y="521" text-anchor="middle">OTLP pushed · Datadog and S3 folders polled</text>
  <path class="edge" d="M310,500 C352,500 352,350 388,350" marker-end="url(#ah)"/>

  <!-- Readers -->
  <rect class="box" x="390" y="490" width="140" height="56" rx="6"/>
  <text class="tb" x="460" y="512" text-anchor="middle">seshi CLI</text>
  <text class="ts" x="460" y="531" text-anchor="middle">sessions · search</text>
  <rect class="box" x="545" y="490" width="135" height="56" rx="6"/>
  <text class="tb" x="612" y="512" text-anchor="middle">API clients</text>
  <text class="ts" x="612" y="531" text-anchor="middle">service tokens</text>
  <rect class="box" x="766" y="490" width="198" height="56" rx="6"/>
  <text class="tb" x="865" y="512" text-anchor="middle">Change-feed readers</text>
  <text class="ts" x="865" y="531" text-anchor="middle">Dosu, indexers</text>
  <path class="edge" d="M460,422 V488" marker-end="url(#ah)"/>
  <path class="edge" d="M612,422 V488" marker-end="url(#ah)"/>
  <text class="ts" x="620" y="478">GET /v1/…</text>
  <path class="edge" d="M900,422 V488" marker-end="url(#ah)"/>
  <text class="ts" x="908" y="478">list changes/</text>

  <!-- Key -->
  <path class="edge-dash" d="M20,578 H56"/>
  <text class="ts" x="64" y="582">serverless mode: no server; each laptop runs the pipeline and writes its own folder</text>
  <path class="edge-accent" d="M560,578 H596"/>
  <text class="ts" x="604" y="582">one session's path</text>
</svg>
