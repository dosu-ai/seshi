# seshi in a container. Fill in `.env` (copy `.env.example`: the tokens, the bucket URL and its
# keys, as SESHI_* settings), then `docker compose up -d`. A seshi.toml can be mounted at
# /etc/seshi/seshi.toml instead (docs/config.md). The /data volume only matters for a file://
# store.
services:
  # The service and volume keep their sessiondb names, so an existing volume is kept.
  sessiondb:
    build:
      context: .
      dockerfile: apps/seshi/Dockerfile
    env_file: .env
    ports:
      - "${HOST_PORT:-7200}:7200"
    volumes:
      - sessiondb-data:/data
      # - ./seshi.toml:/etc/seshi/seshi.toml:ro
    restart: unless-stopped

volumes:
  sessiondb-data:
