apiVersion: v1
kind: Pod
metadata:
  name: {{ include "seshi.fullname" . }}-test
  labels:
    {{- include "seshi.releaseLabels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  enableServiceLinks: false
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: healthcheck
      image: {{ include "seshi.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      # The image has no curl: seshi asks /healthz itself.
      args: ["healthcheck", "--url", "http://{{ include "seshi.fullname" . }}:{{ .Values.service.port }}/healthz"]
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
